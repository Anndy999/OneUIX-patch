name: Build and Release anndy999 V8 Presets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/anndy999-v8-presets-release.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle

      - name: Apply V8 double-line clock preset patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          statusbar = root / "app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt"
          main_hook = root / "app/src/main/java/io/github/soclear/oneuix/hook/Main.kt"
          detail = root / "app/src/main/java/io/github/soclear/oneuix/ui/category/DetailPaneSystemUI.kt"
          manifest = root / "app/src/main/AndroidManifest.xml"
          gradle = root / "app/build.gradle.kts"

          # ---------- StatusBar.kt ----------
          text = statusbar.read_text(encoding="utf-8")

          if "import android.text.style.RelativeSizeSpan" not in text:
              anchor = "import android.os.SystemClock\n"
              replacement = (
                  "import android.os.SystemClock\n"
                  "import android.text.SpannableString\n"
                  "import android.text.Spanned\n"
                  "import android.text.style.RelativeSizeSpan\n"
              )
              if anchor not in text:
                  raise SystemExit("StatusBar.kt import anchor not found")
              text = text.replace(anchor, replacement, 1)

          old = """    fun setStatusBarClockFormat(loadPackageParam: LoadPackageParam, format: String) {
                  if (loadPackageParam.packageName != Package.SYSTEMUI) return
                  val dateTimeFormatter = try {
                      DateTimeFormatter.ofPattern(format)
                  } catch (_: Throwable) {
                      DateTimeFormatter.ofPattern("HH:mm")
                  }
                  setStatusBarClockText(loadPackageParam) {
                      dateTimeFormatter.format(LocalDateTime.now())
                  }
              }

              private fun setStatusBarClockText(loadPackageParam: LoadPackageParam, block: () -> String) {
                  if (loadPackageParam.packageName != Package.SYSTEMUI) return
                  val callback = object : XC_MethodReplacement() {
                      override fun replaceHookedMethod(param: MethodHookParam): Any? {
                          val clockTextView = param.thisObject as TextView
                          val dateTime = block()
                          clockTextView.text = dateTime
                          clockTextView.contentDescription = dateTime
                          return null
                      }
                  }
          """

          new = """    fun setStatusBarClockFormat(
                  loadPackageParam: LoadPackageParam,
                  format: String,
                  doubleLinePresetScale: Float = 1f
              ) {
                  if (loadPackageParam.packageName != Package.SYSTEMUI) return
                  val dateTimeFormatter = try {
                      DateTimeFormatter.ofPattern(format)
                  } catch (_: Throwable) {
                      DateTimeFormatter.ofPattern("HH:mm")
                  }
                  setStatusBarClockText(loadPackageParam, doubleLinePresetScale) {
                      dateTimeFormatter.format(LocalDateTime.now())
                  }
              }

              private fun setStatusBarClockText(
                  loadPackageParam: LoadPackageParam,
                  doubleLinePresetScale: Float,
                  block: () -> String
              ) {
                  if (loadPackageParam.packageName != Package.SYSTEMUI) return
                  val callback = object : XC_MethodReplacement() {
                      override fun replaceHookedMethod(param: MethodHookParam): Any? {
                          val clockTextView = param.thisObject as TextView
                          val dateTime = block()

                          if (dateTime.contains('\\n')) {
                              clockTextView.layoutParams?.let { params ->
                                  if (params.height != ViewGroup.LayoutParams.MATCH_PARENT) {
                                      params.height = ViewGroup.LayoutParams.MATCH_PARENT
                                      clockTextView.layoutParams = params
                                  }
                              }

                              (clockTextView.parent as? LinearLayout)?.let { parent ->
                                  parent.gravity =
                                      (parent.gravity and Gravity.VERTICAL_GRAVITY_MASK.inv()) or
                                          Gravity.CENTER_VERTICAL
                              }

                              clockTextView.isSingleLine = false
                              clockTextView.maxLines = 2
                              clockTextView.minLines = 2
                              clockTextView.includeFontPadding = false
                              clockTextView.ellipsize = null
                              clockTextView.setHorizontallyScrolling(false)
                              clockTextView.gravity =
                                  (clockTextView.gravity and Gravity.VERTICAL_GRAVITY_MASK.inv()) or
                                      Gravity.CENTER_VERTICAL
                              clockTextView.setPaddingRelative(
                                  clockTextView.paddingStart,
                                  0,
                                  clockTextView.paddingEnd,
                                  0
                              )

                              val presetScale = doubleLinePresetScale.coerceIn(0.90f, 1.10f)
                              val timeScale = 0.84f * presetScale
                              val dateScale = 0.72f * presetScale

                              val lineSpacing = when {
                                  presetScale <= 0.90f -> 0.72f
                                  presetScale <= 0.95f -> 0.69f
                                  presetScale <= 1.00f -> 0.66f
                                  presetScale <= 1.05f -> 0.63f
                                  else -> 0.60f
                              }
                              clockTextView.setLineSpacing(0f, lineSpacing)

                              val lineBreak = dateTime.indexOf('\\n')
                              val displayText = SpannableString(dateTime).apply {
                                  if (lineBreak > 0) {
                                      setSpan(
                                          RelativeSizeSpan(timeScale),
                                          0,
                                          lineBreak,
                                          Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                                      )
                                  }
                                  if (lineBreak + 1 < length) {
                                      setSpan(
                                          RelativeSizeSpan(dateScale),
                                          lineBreak + 1,
                                          length,
                                          Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                                      )
                                  }
                              }

                              val density = clockTextView.resources.displayMetrics.density
                              clockTextView.translationY = -0.65f * density
                              clockTextView.text = displayText
                          } else {
                              clockTextView.isSingleLine = true
                              clockTextView.maxLines = 1
                              clockTextView.minLines = 1
                              clockTextView.includeFontPadding = false
                              clockTextView.setHorizontallyScrolling(false)
                              clockTextView.setLineSpacing(0f, 1f)
                              clockTextView.translationY = 0f
                              clockTextView.text = dateTime
                          }

                          clockTextView.contentDescription = dateTime.replace('\\n', ' ')
                          return null
                      }
                  }
          """

          if "val timeScale = 0.84f * presetScale" not in text:
              if old not in text:
                  raise SystemExit("StatusBar.kt clock block not found")
              text = text.replace(old, new, 1)

          for needle in [
              "RelativeSizeSpan(timeScale)",
              "RelativeSizeSpan(dateScale)",
              "val timeScale = 0.84f * presetScale",
              "val dateScale = 0.72f * presetScale",
              "presetScale <= 1.00f -> 0.66f",
              "clockTextView.translationY = -0.65f * density",
              "ViewGroup.LayoutParams.MATCH_PARENT",
          ]:
              if needle not in text:
                  raise SystemExit("StatusBar.kt V8 check failed: " + needle)

          statusbar.write_text(text, encoding="utf-8")

          # ---------- Main.kt ----------
          text = main_hook.read_text(encoding="utf-8")

          old = """                if (preference.systemUI.statusBar.setStatusBarClockFormat) {
                              val format = preference.systemUI.statusBar.statusBarClockFormat
                              StatusBar.setStatusBarClockFormat(lpparam, format)
                          }

                          if (preference.systemUI.statusBar.setStatusBarClockTextScale) {
                              val scale = preference.systemUI.statusBar.statusBarClockTextScale
                              StatusBar.setStatusBarClockTextScale(lpparam, scale)
                          }
          """

          new = """                val statusBarClockFormatEnabled =
                              preference.systemUI.statusBar.setStatusBarClockFormat
                          val statusBarClockFormat =
                              preference.systemUI.statusBar.statusBarClockFormat
                          val isDoubleLineStatusBarClock =
                              statusBarClockFormatEnabled && statusBarClockFormat.contains('\\n')

                          if (statusBarClockFormatEnabled) {
                              val presetScale =
                                  if (
                                      isDoubleLineStatusBarClock &&
                                      preference.systemUI.statusBar.setStatusBarClockTextScale
                                  ) {
                                      preference.systemUI.statusBar.statusBarClockTextScale
                                  } else {
                                      1f
                                  }

                              StatusBar.setStatusBarClockFormat(
                                  lpparam,
                                  statusBarClockFormat,
                                  presetScale
                              )
                          }

                          if (
                              preference.systemUI.statusBar.setStatusBarClockTextScale &&
                              !isDoubleLineStatusBarClock
                          ) {
                              val scale = preference.systemUI.statusBar.statusBarClockTextScale
                              StatusBar.setStatusBarClockTextScale(lpparam, scale)
                          }
          """

          if "isDoubleLineStatusBarClock" not in text:
              if old not in text:
                  raise SystemExit("Main.kt clock block not found")
              text = text.replace(old, new, 1)

          main_hook.write_text(text, encoding="utf-8")

          # ---------- DetailPaneSystemUI.kt ----------
          text = detail.read_text(encoding="utf-8")

          old = """        Column {
                      var scale by remember {
                          mutableFloatStateOf(uiState.statusBar.statusBarClockTextScale)
                      }
                      var expanded by rememberSaveable { mutableStateOf(false) }

                      SwitchItem(
                          title = stringResource(id = R.string.setStatusBarClockTextScale_title),
                          modifier = Modifier.animateContentSize(),
                          summary = if (uiState.statusBar.setStatusBarClockTextScale) {
                              "%.2fx".format(scale)
                          } else null,
                          icon = ImageVector.vectorResource(id = R.drawable.format_size),
                          clickable = true,
                          onClick = { expanded = !expanded },
                          checked = uiState.statusBar.setStatusBarClockTextScale,
                          onCheckedChange = {
                              if (it && scale == 1f) {
                                  expanded = true
                              } else if (!it) {
                                  expanded = false
                              }
                              onEvent(SystemUIEvent.StatusBar.SetStatusBarClockTextScale(it))
                          }
                      )
                      AnimatedVisibility(expanded && uiState.statusBar.setStatusBarClockTextScale) {
                          Slider(
                              value = scale,
                              onValueChange = { scale = it },
                              modifier = Modifier.padding(horizontal = 16.dp),
                              valueRange = 0.5f..2.5f,
                              onValueChangeFinished = {
                                  onEvent(SystemUIEvent.StatusBar.StatusBarClockTextScale(scale))
                              }
                          )
                      }
                  }
          """

          new = """        Column {
                      val presetValues = listOf(0.90f, 0.95f, 1.00f, 1.05f, 1.10f)
                      val presetLabels = listOf(
                          "小 / Small",
                          "较小 / Compact",
                          "标准 / Standard（推荐）",
                          "较大 / Large",
                          "大 / XL"
                      )
                      val currentScale = uiState.statusBar.statusBarClockTextScale
                      val selectedPreset = when {
                          currentScale < 0.925f -> 0
                          currentScale < 0.975f -> 1
                          currentScale < 1.025f -> 2
                          currentScale < 1.075f -> 3
                          else -> 4
                      }

                      SwitchItem(
                          title = stringResource(id = R.string.setStatusBarClockTextScale_title),
                          modifier = Modifier.animateContentSize(),
                          summary = if (uiState.statusBar.setStatusBarClockTextScale) {
                              presetLabels[selectedPreset]
                          } else null,
                          icon = ImageVector.vectorResource(id = R.drawable.format_size),
                          checked = uiState.statusBar.setStatusBarClockTextScale,
                          onCheckedChange = {
                              onEvent(SystemUIEvent.StatusBar.SetStatusBarClockTextScale(it))
                          }
                      )

                      AnimatedVisibility(
                          uiState.statusBar.setStatusBarClockTextScale &&
                              uiState.statusBar.statusBarClockFormat.contains('\\n')
                      ) {
                          SelectItem(
                              title = "双行时间大小 / Double-line size",
                              icon = ImageVector.vectorResource(id = R.drawable.format_size),
                              entries = presetLabels,
                              selectedIndex = selectedPreset,
                              onSelectedIndexChange = { index ->
                                  onEvent(
                                      SystemUIEvent.StatusBar.StatusBarClockTextScale(
                                          presetValues[index]
                                      )
                                  )
                              }
                          )
                      }
                  }
          """

          if "val presetValues = listOf(0.90f, 0.95f, 1.00f, 1.05f, 1.10f)" not in text:
              if old not in text:
                  raise SystemExit("DetailPaneSystemUI.kt clock scale block not found")
              text = text.replace(old, new, 1)

          detail.write_text(text, encoding="utf-8")

          # ---------- Branding/version ----------
          text = manifest.read_text(encoding="utf-8")
          text = text.replace(
              'android:label="@string/app_name"',
              'android:label="One UI X · anndy999 V8"',
              1
          )
          text = text.replace(
              'android:value="@string/xposed_description"',
              'android:value="Samsung One UI Extension · modified by anndy999 · V8 Presets"',
              1
          )
          manifest.write_text(text, encoding="utf-8")

          text = gradle.read_text(encoding="utf-8")
          text = re.sub(
              r'applicationId = "[^"]+"',
              'applicationId = "io.github.anndy999.oneuix"',
              text,
              count=1
          )
          text = re.sub(r'versionCode = \d+', 'versionCode = 20', text, count=1)
          text = re.sub(
              r'versionName = "[^"]+"',
              'versionName = "1.7.0-anndy999-v8-presets"',
              text,
              count=1
          )
          gradle.write_text(text, encoding="utf-8")

          print("V8 patch applied successfully")

          PY

      - name: Verify generated source
        shell: bash
        run: |
          STATUS="app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt"
          MAIN="app/src/main/java/io/github/soclear/oneuix/hook/Main.kt"
          UI="app/src/main/java/io/github/soclear/oneuix/ui/category/DetailPaneSystemUI.kt"

          grep -F "val timeScale = 0.84f * presetScale" "$STATUS"
          grep -F "val dateScale = 0.72f * presetScale" "$STATUS"
          grep -F "presetScale <= 1.00f -> 0.66f" "$STATUS"
          grep -F "clockTextView.translationY = -0.65f * density" "$STATUS"
          grep -F "isDoubleLineStatusBarClock" "$MAIN"
          grep -F "presetValues = listOf(0.90f, 0.95f, 1.00f, 1.05f, 1.10f)" "$UI"

          if grep -Fq "safeHeight" "$STATUS"; then
            echo "ERROR: old dynamic shrinking code detected"
            exit 1
          fi

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Prepare Release APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            dist/OneUIX-anndy999-v8-presets.apk

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v8.0.${{ GITHUB_RUN_NUMBER }}"
          APK="dist/OneUIX-anndy999-v8-presets.apk"
          TITLE="OneUIX anndy999 V8 Presets"
          NOTES="V8: Samsung-fit two-line status-bar clock with 5 user-selectable size presets. Standard = 84% time / 72% date, with vertical centering and -0.65dp optical correction."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

      - name: Upload Actions backup
        uses: actions/upload-artifact@v7
        with:
          name: OneUIX-anndy999-v8-presets
          path: dist/OneUIX-anndy999-v8-presets.apk
          retention-days: 15
          archive: false
