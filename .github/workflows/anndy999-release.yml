name: Build and Release OneUIX anndy999 V13 Status Bar Runtime Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/anndy999-release.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Prepare Release asset
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            dist/OneUIX-anndy999-v13-statusbar-runtime-fix.apk

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v13.0.${{ github.run_number }}
          name: OneUIX anndy999 V13 Status Bar Runtime Fix
          target_commitish: ${{ github.sha }}
          body: >-
            Samsung status-bar runtime update fix built directly from the repository source.
          files: dist/OneUIX-anndy999-v13-statusbar-runtime-fix.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
