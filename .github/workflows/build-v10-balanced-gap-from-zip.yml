name: Build V10 Balanced Gap From ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/OneUIX-anndy999-v10-balanced-gap-source.zip'
      - '.github/workflows/build-v10-balanced-gap-from-zip.yml'

permissions:
  contents: write

concurrency:
  group: oneuix-v10-balanced-gap
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Extract V10 source
        shell: bash
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q ".github/workflows/OneUIX-anndy999-v10-balanced-gap-source.zip" -d buildsrc

          SRC_DIR="$(find buildsrc -maxdepth 3 -type f -name gradlew -printf '%h\n' | head -n 1)"
          if [ -z "$SRC_DIR" ]; then
            echo "ERROR: gradlew not found after extracting V10 source."
            find buildsrc -maxdepth 3 -type f | head -n 100
            exit 1
          fi

          echo "SRC_DIR=$SRC_DIR" >> "$GITHUB_ENV"
          echo "Detected source root: $SRC_DIR"

      - name: Self-check V10 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["SRC_DIR"])
          candidates = list(root.rglob("StatusBar.kt"))
          if not candidates:
              raise SystemExit("FAIL - StatusBar.kt not found")

          status = candidates[0].read_text(encoding="utf-8", errors="ignore")
          checks = {
              "double-line handling": "contains('\\n')" in status or 'contains("\\n")' in status,
              "vertical centering": "CENTER_VERTICAL" in status,
              "full-height layout": "MATCH_PARENT" in status,
              "font inheritance / no forced family": "typeface =" not in status,
              "line spacing support": "setLineSpacing" in status,
          }

          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL") + " - " + name)

          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("V10 self-check failed: " + ", ".join(failed))

          print("V10 source self-check completed successfully.")
          PY

      - name: Build APK
        shell: bash
        run: |
          cd "$SRC_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          APK="$(find "$SRC_DIR/app/build/outputs/apk" -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "ERROR: built APK not found."
            exit 1
          fi
          cp "$APK" "dist/OneUIX-anndy999-v10-balanced-gap.apk"
          ls -lh dist/

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v10.0.${GITHUB_RUN_NUMBER}"
          APK="dist/OneUIX-anndy999-v10-balanced-gap.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "OneUIX anndy999 V10 Balanced Gap" \
              --notes "V10: balanced two-line time/date sizing, user-adjustable line gap, centered Samsung status-bar alignment, and current-system-font inheritance."
          fi

      - name: Upload backup artifact
        uses: actions/upload-artifact@v7
        with:
          name: OneUIX-anndy999-v10-balanced-gap
          path: dist/OneUIX-anndy999-v10-balanced-gap.apk
          retention-days: 7
          archive: false
