name: Build anndy999 Double-line Clock V2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/anndy999-doubleline-build-v2.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle

      - name: Apply anndy999 V2 double-line clock patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          statusbar = root / 'app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt'
          manifest = root / 'app/src/main/AndroidManifest.xml'
          gradle = root / 'app/build.gradle.kts'
          arrays = root / 'app/src/main/res/values/arrays.xml'

          text = statusbar.read_text(encoding='utf-8')

          old_imports = 'import android.content.Context\nimport android.os.Build\n'
          new_imports = (
              'import android.content.Context\n'
              'import android.os.Build\n'
              'import android.text.SpannableString\n'
              'import android.text.Spanned\n'
              'import android.text.style.RelativeSizeSpan\n'
          )
          if 'import android.text.SpannableString' not in text:
              if old_imports not in text:
                  raise SystemExit('StatusBar.kt import block not found')
              text = text.replace(old_imports, new_imports, 1)

          old = '''                val clockTextView = param.thisObject as TextView
                val dateTime = block()
                clockTextView.text = dateTime
                clockTextView.contentDescription = dateTime
                return null
'''

          new = '''                val clockTextView = param.thisObject as TextView
                val dateTime = block()

                val displayText: CharSequence = if (dateTime.contains('\\n')) {
                    clockTextView.isSingleLine = false
                    clockTextView.maxLines = 2
                    clockTextView.includeFontPadding = false
                    clockTextView.ellipsize = null
                    clockTextView.setHorizontallyScrolling(false)

                    clockTextView.gravity =
                        (clockTextView.gravity and Gravity.VERTICAL_GRAVITY_MASK.inv()) or Gravity.CENTER_VERTICAL

                    clockTextView.setPadding(
                        clockTextView.paddingLeft,
                        0,
                        clockTextView.paddingRight,
                        0
                    )
                    clockTextView.setLineSpacing(0f, 0.70f)

                    SpannableString(dateTime).apply {
                        val lineBreak = dateTime.indexOf('\\n')
                        if (lineBreak > 0) {
                            setSpan(
                                RelativeSizeSpan(0.60f),
                                0,
                                lineBreak,
                                Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                            )
                        }
                        if (lineBreak + 1 < length) {
                            setSpan(
                                RelativeSizeSpan(0.50f),
                                lineBreak + 1,
                                length,
                                Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                            )
                        }
                    }
                } else {
                    dateTime
                }

                clockTextView.text = displayText
                clockTextView.contentDescription = dateTime
                return null
'''

          if 'val displayText: CharSequence = if (dateTime.contains' not in text:
              if old not in text:
                  raise SystemExit('StatusBar.kt clock hook block not found')
              text = text.replace(old, new, 1)

          statusbar.write_text(text, encoding='utf-8')

          text = manifest.read_text(encoding='utf-8')
          text = text.replace(
              'android:label="@string/app_name"',
              'android:label="One UI X · anndy999 V2"',
              1
          )
          text = text.replace(
              'android:value="@string/xposed_description"',
              'android:value="Samsung One UI Extension · modified by anndy999 · Double-line V2"',
              1,
          )
          manifest.write_text(text, encoding='utf-8')

          text = gradle.read_text(encoding='utf-8')
          text = text.replace(
              'applicationId = "io.github.soclear.oneuix"',
              'applicationId = "io.github.anndy999.oneuix.v2"',
              1,
          )
          text = text.replace(
              'versionName = "1.7.0"',
              'versionName = "1.7.0-anndy999-doubleline-v2"',
              1
          )
          gradle.write_text(text, encoding='utf-8')

          text = arrays.read_text(encoding='utf-8')
          if '<item>io.github.anndy999.oneuix.v2</item>' not in text:
              text = text.replace(
                  '<item>android</item>',
                  '<item>android</item>\n        <item>io.github.anndy999.oneuix.v2</item>',
                  1,
              )
          arrays.write_text(text, encoding='utf-8')

          print('V2 patch applied: centered and reduced double-line clock')
          PY

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/OneUIX-anndy999-doubleline-v2-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: OneUIX-anndy999-doubleline-v2
          path: app/build/outputs/apk/debug/OneUIX-anndy999-doubleline-v2-debug.apk
          retention-days: 15
          archive: false
