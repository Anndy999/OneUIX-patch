name: Build and Release anndy999 V6 Optical Center

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/anndy999-v6-optical-center-release.yml'

permissions:
  contents: write
  actions: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle

      - name: Apply V6 optical-center patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          statusbar = root / "app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt"
          manifest = root / "app/src/main/AndroidManifest.xml"
          gradle = root / "app/build.gradle.kts"

          text = statusbar.read_text(encoding="utf-8")

          old_lines = [
              "                val clockTextView = param.thisObject as TextView",
              "                val dateTime = block()",
              "                clockTextView.text = dateTime",
              "                clockTextView.contentDescription = dateTime",
              "                return null",
          ]
          old = "\n".join(old_lines) + "\n"

          nl = chr(92) + "n"

          new_lines = [
              "                val clockTextView = param.thisObject as TextView",
              "                val dateTime = block()",
              "",
              f"                if (dateTime.contains('{nl}')) {{",
              "                    // Android TextView gravity only centers the content box;",
              "                    // font metrics can still make two lines look visually low.",
              "                    // Keep the original Samsung clock text size, tighten line spacing,",
              "                    // and apply a small upward optical offset.",
              "                    clockTextView.layoutParams?.let { params ->",
              "                        if (params.height != ViewGroup.LayoutParams.MATCH_PARENT) {",
              "                            params.height = ViewGroup.LayoutParams.MATCH_PARENT",
              "                            clockTextView.layoutParams = params",
              "                        }",
              "                    }",
              "                    (clockTextView.parent as? LinearLayout)?.let { parent ->",
              "                        parent.gravity =",
              "                            (parent.gravity and Gravity.VERTICAL_GRAVITY_MASK.inv()) or Gravity.CENTER_VERTICAL",
              "                    }",
              "",
              "                    clockTextView.isSingleLine = false",
              "                    clockTextView.setLines(2)",
              "                    clockTextView.includeFontPadding = false",
              "                    clockTextView.ellipsize = null",
              "                    clockTextView.setHorizontallyScrolling(false)",
              "                    clockTextView.gravity =",
              "                        (clockTextView.gravity and Gravity.VERTICAL_GRAVITY_MASK.inv()) or Gravity.CENTER_VERTICAL",
              "                    clockTextView.setPaddingRelative(",
              "                        clockTextView.paddingStart,",
              "                        0,",
              "                        clockTextView.paddingEnd,",
              "                        0",
              "                    )",
              "",
              "                    // Keep Samsung runtime default font size (100%).",
              "                    clockTextView.setLineSpacing(0f, 0.50f)",
              "                    val opticalOffsetY = -1.0f * clockTextView.resources.displayMetrics.density",
              "                    clockTextView.translationY = opticalOffsetY",
              "                    clockTextView.text = dateTime",
              "                } else {",
              "                    clockTextView.isSingleLine = true",
              "                    clockTextView.maxLines = 1",
              "                    clockTextView.minLines = 1",
              "                    clockTextView.includeFontPadding = false",
              "                    clockTextView.setHorizontallyScrolling(false)",
              "                    clockTextView.setLineSpacing(0f, 1f)",
              "                    clockTextView.translationY = 0f",
              "                    clockTextView.text = dateTime",
              "                }",
              "",
              f"                clockTextView.contentDescription = dateTime.replace('{nl}', ' ')",
              "                return null",
          ]
          new = "\n".join(new_lines) + "\n"

          marker = "clockTextView.contentDescription = dateTime"
          if "val opticalOffsetY = -1.0f * clockTextView.resources.displayMetrics.density" not in text:
              if old in text:
                  text = text.replace(old, new, 1)
              else:
                  raise SystemExit("StatusBar.kt clock replacement block not found")

          required = [
              "ViewGroup.LayoutParams.MATCH_PARENT",
              "Gravity.CENTER_VERTICAL",
              "clockTextView.setLineSpacing(0f, 0.50f)",
              "val opticalOffsetY = -1.0f * clockTextView.resources.displayMetrics.density",
              "clockTextView.translationY = opticalOffsetY",
              "dateTime.contains('" + nl + "')",
          ]
          for item in required:
              if item not in text:
                  raise SystemExit("V6 sanity check failed: " + item)

          if "RelativeSizeSpan(" in text or "AbsoluteSizeSpan(" in text:
              raise SystemExit("V6 sanity check failed: font scaling code is still present")

          statusbar.write_text(text, encoding="utf-8")

          text = manifest.read_text(encoding="utf-8")
          text = re.sub(
              r'android:label="[^"]*"',
              'android:label="One UI X · anndy999 V6 Optical Center"',
              text,
              count=1
          )
          text = text.replace(
              'android:value="@string/xposed_description"',
              'android:value="Samsung One UI Extension · modified by anndy999 · Double-line V6 Optical Center"',
              1
          )
          manifest.write_text(text, encoding="utf-8")

          text = gradle.read_text(encoding="utf-8")
          text = re.sub(
              r'applicationId = "[^"]+"',
              'applicationId = "io.github.anndy999.oneuix"',
              text,
              count=1
          )
          text = re.sub(r'versionCode = \d+', 'versionCode = 14', text, count=1)
          text = re.sub(
              r'versionName = "[^"]+"',
              'versionName = "1.7.0-anndy999-v6-optical-center"',
              text,
              count=1
          )
          gradle.write_text(text, encoding="utf-8")

          print("V6 applied: original font size + optical upward centering")
          PY

      - name: Verify generated source
        shell: bash
        run: |
          grep -F "clockTextView.setLineSpacing(0f, 0.50f)" \
            app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt
          grep -F "val opticalOffsetY = -1.0f * clockTextView.resources.displayMetrics.density" \
            app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt
          grep -F "ViewGroup.LayoutParams.MATCH_PARENT" \
            app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt
          if grep -Eq "RelativeSizeSpan\(|AbsoluteSizeSpan\(" \
            app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt; then
            echo "Unexpected font scaling code found"
            exit 1
          fi

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build installable APK
        run: ./gradlew assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            dist/OneUIX-anndy999-v6-optical-center.apk

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v6.0.${GITHUB_RUN_NUMBER}"
          APK="dist/OneUIX-anndy999-v6-optical-center.apk"
          TITLE="OneUIX anndy999 V6 Optical Center"
          NOTES="V6: original Samsung clock font size restored (100%), no font scaling. Two-line clock keeps true vertical centering behavior and adds a small upward optical offset to correct the visually low position relative to right-side status icons."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

      - name: Upload Actions backup
        uses: actions/upload-artifact@v7
        with:
          name: OneUIX-anndy999-v6-optical-center
          path: dist/OneUIX-anndy999-v6-optical-center.apk
          retention-days: 15
          archive: false
