name: Build anndy999 Double-line Clock V3 Centered

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/anndy999-doubleline-v3-centered.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle

      - name: Apply Samsung-layout-aware V3 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")
          statusbar = root / "app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt"
          manifest = root / "app/src/main/AndroidManifest.xml"
          gradle = root / "app/build.gradle.kts"

          text = statusbar.read_text(encoding="utf-8")

          import_anchor = "import android.os.Build\n"
          extra_imports = (
              "import android.os.Build\n"
              "import android.text.SpannableString\n"
              "import android.text.Spanned\n"
              "import android.text.style.AbsoluteSizeSpan\n"
          )
          if "import android.text.style.AbsoluteSizeSpan" not in text:
              if import_anchor not in text:
                  raise SystemExit("StatusBar.kt import anchor not found")
              text = text.replace(import_anchor, extra_imports, 1)

          old_lines = [
              "                val clockTextView = param.thisObject as TextView",
              "                val dateTime = block()",
              "                clockTextView.text = dateTime",
              "                clockTextView.contentDescription = dateTime",
              "                return null",
          ]
          old = "\n".join(old_lines) + "\n"

          # Explicitly generate Kotlin's '\n' char literal without nested-escape ambiguity.
          nl = chr(92) + "n"

          new_lines = [
              "                val clockTextView = param.thisObject as TextView",
              "                val dateTime = block()",
              "",
              f"                if (dateTime.contains('{nl}')) {{",
              "                    // Samsung status_bar.xml uses MATCH_PARENT height and CENTER_VERTICAL",
              "                    // for both the left clock container and the clock TextView.",
              "                    // Preserve that stock geometry; only change single-line text behavior.",
              "                    clockTextView.layoutParams?.let { params ->",
              "                        if (params.height != ViewGroup.LayoutParams.MATCH_PARENT) {",
              "                            params.height = ViewGroup.LayoutParams.MATCH_PARENT",
              "                            clockTextView.layoutParams = params",
              "                        }",
              "                    }",
              "                    (clockTextView.parent as? LinearLayout)?.gravity = Gravity.CENTER_VERTICAL",
              "",
              "                    clockTextView.isSingleLine = false",
              "                    clockTextView.setLines(2)",
              "                    clockTextView.includeFontPadding = false",
              "                    clockTextView.ellipsize = null",
              "                    clockTextView.setHorizontallyScrolling(false)",
              "                    clockTextView.textAlignment = View.TEXT_ALIGNMENT_VIEW_START",
              "                    clockTextView.gravity = Gravity.START or Gravity.CENTER_VERTICAL",
              "                    clockTextView.setPaddingRelative(",
              "                        clockTextView.paddingStart,",
              "                        0,",
              "                        clockTextView.paddingEnd,",
              "                        0",
              "                    )",
              "",
              "                    // Samsung resets the stock clock size from status_bar_clock_size",
              "                    // multiplied by IndicatorScaleGardener's current ratio.",
              "                    // Use the resulting runtime TextView size as our base so density,",
              "                    // display zoom and One UI X's clock scaling remain respected.",
              "                    val basePx = clockTextView.textSize.coerceAtLeast(1f)",
              "                    val fontMetrics = clockTextView.paint.fontMetrics",
              "                    val baseLineHeight =",
              "                        (fontMetrics.descent - fontMetrics.ascent).coerceAtLeast(basePx)",
              "",
              "                    val lineSpacingMult = 0.78f",
              "                    var timeScale = 0.74f",
              "                    var dateScale = 0.58f",
              "",
              "                    // Fit dynamically to the actual Samsung status-bar height.",
              "                    // The 92% safety area avoids clipping on fonts with tall ascenders/descenders.",
              "                    val measuredHeight = clockTextView.height",
              "                    val availableHeight =",
              "                        if (measuredHeight > 0) measuredHeight.toFloat()",
              "                        else baseLineHeight * 1.45f",
              "                    val estimatedHeight =",
              "                        baseLineHeight * (timeScale * lineSpacingMult + dateScale)",
              "                    val safeHeight = availableHeight * 0.92f",
              "                    if (estimatedHeight > safeHeight && safeHeight > 0f) {",
              "                        val fit = (safeHeight / estimatedHeight).coerceAtMost(1f)",
              "                        timeScale *= fit",
              "                        dateScale *= fit",
              "                    }",
              "",
              "                    clockTextView.setLineSpacing(0f, lineSpacingMult)",
              f"                    val lineBreak = dateTime.indexOf('{nl}')",
              "                    val displayText = SpannableString(dateTime).apply {",
              "                        if (lineBreak > 0) {",
              "                            setSpan(",
              "                                AbsoluteSizeSpan(",
              "                                    (basePx * timeScale).roundToInt().coerceAtLeast(1),",
              "                                    false",
              "                                ),",
              "                                0,",
              "                                lineBreak,",
              "                                Spanned.SPAN_EXCLUSIVE_EXCLUSIVE",
              "                            )",
              "                        }",
              "                        if (lineBreak + 1 < length) {",
              "                            setSpan(",
              "                                AbsoluteSizeSpan(",
              "                                    (basePx * dateScale).roundToInt().coerceAtLeast(1),",
              "                                    false",
              "                                ),",
              "                                lineBreak + 1,",
              "                                length,",
              "                                Spanned.SPAN_EXCLUSIVE_EXCLUSIVE",
              "                            )",
              "                        }",
              "                    }",
              "",
              "                    // Samsung already centers the TextView box; this tiny downward",
              "                    // optical correction compensates for two-line font metrics.",
              "                    val density = clockTextView.resources.displayMetrics.density",
              "                    clockTextView.translationY = density * 0.75f",
              "                    clockTextView.text = displayText",
              "                } else {",
              "                    // Restore Samsung's stock single-line behavior when no newline is used.",
              "                    clockTextView.isSingleLine = true",
              "                    clockTextView.maxLines = 1",
              "                    clockTextView.minLines = 1",
              "                    clockTextView.includeFontPadding = false",
              "                    clockTextView.setHorizontallyScrolling(false)",
              "                    clockTextView.textAlignment = View.TEXT_ALIGNMENT_VIEW_START",
              "                    clockTextView.gravity = Gravity.START or Gravity.CENTER_VERTICAL",
              "                    clockTextView.setLineSpacing(0f, 1f)",
              "                    clockTextView.translationY = 0f",
              "                    clockTextView.text = dateTime",
              "                }",
              "",
              f"                clockTextView.contentDescription = dateTime.replace('{nl}', ' ')",
              "                return null",
          ]
          new = "\n".join(new_lines) + "\n"

          if "Fit dynamically to the actual Samsung status-bar height." not in text:
              if old not in text:
                  raise SystemExit("StatusBar.kt clock replacement block not found")
              text = text.replace(old, new, 1)

          required_snippets = [
              "ViewGroup.LayoutParams.MATCH_PARENT",
              "Gravity.START or Gravity.CENTER_VERTICAL",
              "AbsoluteSizeSpan(",
              "val lineSpacingMult = 0.78f",
              "var timeScale = 0.74f",
              "var dateScale = 0.58f",
              "clockTextView.translationY = density * 0.75f",
              "clockTextView.translationY = 0f",
              "dateTime.contains('" + nl + "')",
              "dateTime.indexOf('" + nl + "')",
              "dateTime.replace('" + nl + "', ' ')",
          ]
          for snippet in required_snippets:
              if snippet not in text:
                  raise SystemExit(f"V3 sanity check failed: missing {snippet}")

          invalid_overescaped = "contains('" + chr(92) + chr(92) + "n')"
          if invalid_overescaped in text:
              raise SystemExit("V3 sanity check failed: over-escaped newline detected")

          statusbar.write_text(text, encoding="utf-8")

          text = manifest.read_text(encoding="utf-8")
          if 'android:label="@string/app_name"' in text:
              text = text.replace(
                  'android:label="@string/app_name"',
                  'android:label="One UI X · anndy999 V3 Centered"',
                  1,
              )
          if 'android:value="@string/xposed_description"' in text:
              text = text.replace(
                  'android:value="@string/xposed_description"',
                  'android:value="Samsung One UI Extension · modified by anndy999 · Double-line V3 Centered"',
                  1,
              )
          manifest.write_text(text, encoding="utf-8")

          text = gradle.read_text(encoding="utf-8")
          if 'applicationId = "io.github.soclear.oneuix"' in text:
              text = text.replace(
                  'applicationId = "io.github.soclear.oneuix"',
                  'applicationId = "io.github.anndy999.oneuix.v3centered"',
                  1,
              )
          if 'versionCode = 9' in text:
              text = text.replace('versionCode = 9', 'versionCode = 10', 1)
          if 'versionName = "1.7.0"' in text:
              text = text.replace(
                  'versionName = "1.7.0"',
                  'versionName = "1.7.0-anndy999-doubleline-v3-centered"',
                  1,
              )
          gradle.write_text(text, encoding="utf-8")

          print("V3 Centered patch applied; static sanity checks passed")
          PY

      - name: Verify generated source before build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBar.kt")
          text = p.read_text(encoding="utf-8")
          checks = {
              "two-line detection": "dateTime.contains('\\n')",
              "full-height stock geometry": "ViewGroup.LayoutParams.MATCH_PARENT",
              "vertical centering": "Gravity.START or Gravity.CENTER_VERTICAL",
              "dynamic fit": "val safeHeight = availableHeight * 0.92f",
              "readable time scale": "var timeScale = 0.74f",
              "readable date scale": "var dateScale = 0.58f",
              "optical correction": "clockTextView.translationY = density * 0.75f",
              "single-line reset": "clockTextView.translationY = 0f",
              "accessible description": "dateTime.replace('\\n', ' ')",
          }
          missing = [name for name, snippet in checks.items() if snippet not in text]
          if missing:
              raise SystemExit("Generated-source verification failed: " + ", ".join(missing))
          print("Generated-source verification passed:", ", ".join(checks))
          PY

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/OneUIX-anndy999-doubleline-v3-centered-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: OneUIX-anndy999-doubleline-v3-centered-debug.apk
          path: app/build/outputs/apk/debug/OneUIX-anndy999-doubleline-v3-centered-debug.apk
          retention-days: 15
          archive: false
